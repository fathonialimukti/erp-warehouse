name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_warehouse_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_warehouse_e2e
      JWT_SECRET: e2e-test-secret-not-for-production
      DEMO_LOGIN_ENABLED: "true"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/client
        run: bunx playwright install --with-deps chromium

      - name: Apply migrations (server)
        working-directory: apps/server
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_warehouse_e2e

      - name: Ensure permissions (server)
        working-directory: apps/server
        run: bun src/scripts/ensure-permissions.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_warehouse_e2e

      - name: Seed E2E test data
        working-directory: apps/client
        run: bun src/tests/e2e/helpers/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_warehouse_e2e

      - name: Run E2E tests
        working-directory: apps/client
        run: bunx playwright test --reporter=github
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_warehouse_e2e
          JWT_SECRET: e2e-test-secret-not-for-production

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: |
            apps/client/test-results/
            apps/client/blob-report/
          retention-days: 7
