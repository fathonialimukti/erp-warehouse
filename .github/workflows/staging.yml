name: Staging

on:
  push:
    branches:
      - develop
      - feature/*
  pull_request:
    branches:
      - develop

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Staging)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_warehouse_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_warehouse_staging
      JWT_SECRET: staging-test-secret-not-for-production
      NODE_ENV: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        working-directory: apps/server
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Run server tests
        working-directory: apps/server
        run: bun run test

      - name: Build
        run: bun run build

      - name: Comment PR with build status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Staging Build Passed\n\nCommit: \`${context.sha.slice(0, 7)}\`\n\nAll checks passed: typecheck, lint, server tests, build.`
            })
